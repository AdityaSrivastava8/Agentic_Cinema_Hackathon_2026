apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sentinel-a2a
spec:
  template:
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/sentinel-a2a/sentinel-a2a:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID" 
